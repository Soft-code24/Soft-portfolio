<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_4 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_4" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_4');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Interactive 3D particle background for Hero section
// Container is injected into the scope.
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
camera.position.z = 45;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Create interactive particle field & connecting constellation lines
const particleCount = 220;
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
const velocities = new Float32Array(particleCount * 3);
const basePositions = new Float32Array(particleCount * 3);

// Tech palette: Electric blue #2563EB, lighter cyan-blue #60A5FA, soft white
const colors = new Float32Array(particleCount * 3);
const colorChoices = [
  new THREE.Color(0x2563eb),
  new THREE.Color(0x3b82f6),
  new THREE.Color(0x60a5fa),
  new THREE.Color(0x93c5fd),
  new THREE.Color(0x1d4ed8)
];

const spreadX = 80;
const spreadY = 45;
const spreadZ = 30;

for (let i = 0; i < particleCount; i++) {
  const i3 = i * 3;
  const x = (Math.random() - 0.5) * spreadX;
  const y = (Math.random() - 0.5) * spreadY;
  const z = (Math.random() - 0.5) * spreadZ;
  
  positions[i3] = x;
  positions[i3 + 1] = y;
  positions[i3 + 2] = z;

  basePositions[i3] = x;
  basePositions[i3 + 1] = y;
  basePositions[i3 + 2] = z;

  velocities[i3] = (Math.random() - 0.5) * 0.04;
  velocities[i3 + 1] = (Math.random() - 0.5) * 0.04;
  velocities[i3 + 2] = (Math.random() - 0.5) * 0.02;

  const col = colorChoices[Math.floor(Math.random() * colorChoices.length)];
  colors[i3] = col.r;
  colors[i3 + 1] = col.g;
  colors[i3 + 2] = col.b;
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

// Custom particle circle texture for clean rounded particles
const canvas = document.createElement('canvas');
canvas.width = 32;
canvas.height = 32;
const ctx = canvas.getContext('2d');
const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
grad.addColorStop(0, 'rgba(255,255,255,1)');
grad.addColorStop(0.3, 'rgba(255,255,255,0.8)');
grad.addColorStop(0.8, 'rgba(255,255,255,0.2)');
grad.addColorStop(1, 'rgba(255,255,255,0)');
ctx.fillStyle = grad;
ctx.beginPath();
ctx.arc(16, 16, 16, 0, Math.PI * 2);
ctx.fill();

const particleTexture = new THREE.CanvasTexture(canvas);

const pMaterial = new THREE.PointsMaterial({
  size: 2.2,
  map: particleTexture,
  transparent: true,
  opacity: 0.85,
  vertexColors: true,
  depthWrite: false,
  blending: THREE.NormalBlending
});

const particleSystem = new THREE.Points(geometry, pMaterial);
scene.add(particleSystem);

// Constellation network lines
const maxConnections = particleCount * 5;
const linePositions = new Float32Array(maxConnections * 6);
const lineColors = new Float32Array(maxConnections * 6);
const lineGeometry = new THREE.BufferGeometry();
lineGeometry.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
lineGeometry.setAttribute('color', new THREE.BufferAttribute(lineColors, 3));

const lineMaterial = new THREE.LineSegmentsMaterial ? new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.35,
  blending: THREE.NormalBlending,
  depthWrite: false
}) : new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.35,
  blending: THREE.NormalBlending,
  depthWrite: false
});

const linesMesh = new THREE.LineSegments(lineGeometry, lineMaterial);
scene.add(linesMesh);

// Mouse interaction
let mouseX = 0;
let mouseY = 0;
let targetMouseX = 0;
let targetMouseY = 0;

function onMouseMove(event) {
  const rect = container.getBoundingClientRect();
  const relX = event.clientX - rect.left;
  const relY = event.clientY - rect.top;
  
  targetMouseX = ((relX / rect.width) * 2 - 1) * 35;
  targetMouseY = (-(relY / rect.height) * 2 + 1) * 20;
}

window.addEventListener('mousemove', onMouseMove);

function onResize() {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

// Animation loop
let frameId;
const maxDistance = 9.5;

function animate() {
  frameId = requestAnimationFrame(animate);

  // Smooth mouse damping
  mouseX += (targetMouseX - mouseX) * 0.05;
  mouseY += (targetMouseY - mouseY) * 0.05;

  camera.position.x += (mouseX * 0.3 - camera.position.x) * 0.03;
  camera.position.y += (mouseY * 0.3 - camera.position.y) * 0.03;
  camera.lookAt(0, 0, 0);

  const pos = particleSystem.geometry.attributes.position.array;

  // Move particles & subtle drift
  for (let i = 0; i < particleCount; i++) {
    const i3 = i * 3;
    pos[i3] += velocities[i3];
    pos[i3 + 1] += velocities[i3 + 1];
    pos[i3 + 2] += velocities[i3 + 2];

    // Boundaries bounce/wrap
    if (pos[i3] < -spreadX / 2 || pos[i3] > spreadX / 2) velocities[i3] *= -1;
    if (pos[i3 + 1] < -spreadY / 2 || pos[i3 + 1] > spreadY / 2) velocities[i3 + 1] *= -1;
    if (pos[i3 + 2] < -spreadZ / 2 || pos[i3 + 2] > spreadZ / 2) velocities[i3 + 2] *= -1;

    // Repulsion from interactive mouse ray
    const dx = pos[i3] - mouseX;
    const dy = pos[i3 + 1] - mouseY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 12) {
      const force = (12 - dist) / 12 * 0.15;
      pos[i3] += (dx / dist) * force;
      pos[i3 + 1] += (dy / dist) * force;
    }
  }
  particleSystem.geometry.attributes.position.needsUpdate = true;

  // Update dynamic constellation connecting lines
  let vertexIndex = 0;
  let colorIndex = 0;
  let connectionCount = 0;

  for (let i = 0; i < particleCount; i++) {
    const i3 = i * 3;
    for (let j = i + 1; j < particleCount; j++) {
      const j3 = j * 3;
      const dx = pos[i3] - pos[j3];
      const dy = pos[i3 + 1] - pos[j3 + 1];
      const dz = pos[i3 + 2] - pos[j3 + 2];
      const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

      if (dist < maxDistance && connectionCount < maxConnections) {
        const alpha = (1.0 - dist / maxDistance) * 0.45;

        linePositions[vertexIndex++] = pos[i3];
        linePositions[vertexIndex++] = pos[i3 + 1];
        linePositions[vertexIndex++] = pos[i3 + 2];

        linePositions[vertexIndex++] = pos[j3];
        linePositions[vertexIndex++] = pos[j3 + 1];
        linePositions[vertexIndex++] = pos[j3 + 2];

        // Electric blue line coloring with distance fade
        lineColors[colorIndex++] = 0.145 * alpha;
        lineColors[colorIndex++] = 0.388 * alpha;
        lineColors[colorIndex++] = 0.921 * alpha;

        lineColors[colorIndex++] = 0.376 * alpha;
        lineColors[colorIndex++] = 0.647 * alpha;
        lineColors[colorIndex++] = 0.98 * alpha;

        connectionCount++;
      }
    }
  }

  lineGeometry.setDrawRange(0, connectionCount * 2);
  lineGeometry.attributes.position.needsUpdate = true;
  lineGeometry.attributes.color.needsUpdate = true;

  // Subtle rotation
  particleSystem.rotation.y += 0.0006;
  linesMesh.rotation.y += 0.0006;

  renderer.render(scene, camera);
}

animate();

// Cleanup handler
container._threeCleanup = function() {
  cancelAnimationFrame(frameId);
  window.removeEventListener('mousemove', onMouseMove);
  window.removeEventListener('resize', onResize);
  renderer.dispose();
  geometry.dispose();
  pMaterial.dispose();
  lineGeometry.dispose();
  lineMaterial.dispose();
  particleTexture.dispose();
};

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_4 -->
</body>
</html>
