<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_7 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_7" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_7');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Interactive 3D particle constellation with click pulse shockwaves
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
camera.position.z = 45;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const particleCount = 240;
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
const velocities = new Float32Array(particleCount * 3);
const baseVelocities = new Float32Array(particleCount * 3);

// Tech electric blue palette matching design system
const colors = new Float32Array(particleCount * 3);
const colorChoices = [
  new THREE.Color(0x2563eb),
  new THREE.Color(0x3b82f6),
  new THREE.Color(0x60a5fa),
  new THREE.Color(0x93c5fd),
  new THREE.Color(0x1d4ed8)
];

const spreadX = 85;
const spreadY = 50;
const spreadZ = 35;

for (let i = 0; i < particleCount; i++) {
  const i3 = i * 3;
  const x = (Math.random() - 0.5) * spreadX;
  const y = (Math.random() - 0.5) * spreadY;
  const z = (Math.random() - 0.5) * spreadZ;

  positions[i3] = x;
  positions[i3 + 1] = y;
  positions[i3 + 2] = z;

  const vx = (Math.random() - 0.5) * 0.04;
  const vy = (Math.random() - 0.5) * 0.04;
  const vz = (Math.random() - 0.5) * 0.02;

  velocities[i3] = vx;
  velocities[i3 + 1] = vy;
  velocities[i3 + 2] = vz;

  baseVelocities[i3] = vx;
  baseVelocities[i3 + 1] = vy;
  baseVelocities[i3 + 2] = vz;

  const col = colorChoices[Math.floor(Math.random() * colorChoices.length)];
  colors[i3] = col.r;
  colors[i3 + 1] = col.g;
  colors[i3 + 2] = col.b;
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

// Particle radial texture
const canvas = document.createElement('canvas');
canvas.width = 32;
canvas.height = 32;
const ctx = canvas.getContext('2d');
const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
grad.addColorStop(0, 'rgba(255,255,255,1)');
grad.addColorStop(0.3, 'rgba(255,255,255,0.85)');
grad.addColorStop(0.7, 'rgba(255,255,255,0.25)');
grad.addColorStop(1, 'rgba(255,255,255,0)');
ctx.fillStyle = grad;
ctx.beginPath();
ctx.arc(16, 16, 16, 0, Math.PI * 2);
ctx.fill();

const particleTexture = new THREE.CanvasTexture(canvas);

const pMaterial = new THREE.PointsMaterial({
  size: 2.3,
  map: particleTexture,
  transparent: true,
  opacity: 0.9,
  vertexColors: true,
  depthWrite: false,
  blending: THREE.NormalBlending
});

const particleSystem = new THREE.Points(geometry, pMaterial);
scene.add(particleSystem);

// Constellation connecting lines
const maxConnections = particleCount * 5;
const linePositions = new Float32Array(maxConnections * 6);
const lineColors = new Float32Array(maxConnections * 6);
const lineGeometry = new THREE.BufferGeometry();
lineGeometry.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
lineGeometry.setAttribute('color', new THREE.BufferAttribute(lineColors, 3));

const lineMaterial = new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.4,
  blending: THREE.NormalBlending,
  depthWrite: false
});

const linesMesh = new THREE.LineSegments(lineGeometry, lineMaterial);
scene.add(linesMesh);

// Shockwave / click pulses state
const pulses = []; // { x, y, z, radius, maxRadius, strength }

// Mouse coordinates
let mouseX = 0;
let mouseY = 0;
let targetMouseX = 0;
let targetMouseY = 0;

function getSceneCoords(clientX, clientY) {
  const rect = container.getBoundingClientRect();
  const relX = clientX - rect.left;
  const relY = clientY - rect.top;
  const normX = (relX / rect.width) * 2 - 1;
  const normY = -(relY / rect.height) * 2 + 1;
  
  // Approximate world coords on z=0 plane given camera distance 45
  const worldX = normX * 38;
  const worldY = normY * 22;
  return { worldX, worldY, normX, normY };
}

function onMouseMove(event) {
  const coords = getSceneCoords(event.clientX, event.clientY);
  targetMouseX = coords.worldX;
  targetMouseY = coords.worldY;
}

function onMouseDown(event) {
  const coords = getSceneCoords(event.clientX, event.clientY);
  pulses.push({
    x: coords.worldX,
    y: coords.worldY,
    z: 0,
    radius: 0.5,
    maxRadius: 28,
    speed: 0.9,
    strength: 1.8
  });
}

window.addEventListener('mousemove', onMouseMove);
window.addEventListener('pointerdown', onMouseDown);

function onResize() {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

// Animation loop
let frameId;
const maxDistance = 9.5;

function animate() {
  frameId = requestAnimationFrame(animate);

  // Mouse easing
  mouseX += (targetMouseX - mouseX) * 0.05;
  mouseY += (targetMouseY - mouseY) * 0.05;

  camera.position.x += (mouseX * 0.25 - camera.position.x) * 0.03;
  camera.position.y += (mouseY * 0.25 - camera.position.y) * 0.03;
  camera.lookAt(0, 0, 0);

  const pos = particleSystem.geometry.attributes.position.array;

  // Update pulses
  for (let p = pulses.length - 1; p >= 0; p--) {
    const pulse = pulses[p];
    pulse.radius += pulse.speed;
    pulse.strength *= 0.96;

    if (pulse.radius >= pulse.maxRadius || pulse.strength < 0.05) {
      pulses.splice(p, 1);
    }
  }

  // Update particles with motion, mouse repulsion, and pulse shockwaves
  for (let i = 0; i < particleCount; i++) {
    const i3 = i * 3;

    // Apply baseline drift velocity
    pos[i3] += velocities[i3];
    pos[i3 + 1] += velocities[i3 + 1];
    pos[i3 + 2] += velocities[i3 + 2];

    // Dampen temporary impulses back to base velocities
    velocities[i3] += (baseVelocities[i3] - velocities[i3]) * 0.03;
    velocities[i3 + 1] += (baseVelocities[i3 + 1] - velocities[i3 + 1]) * 0.03;
    velocities[i3 + 2] += (baseVelocities[i3 + 2] - velocities[i3 + 2]) * 0.03;

    // Boundary bounces
    if (pos[i3] < -spreadX / 2 || pos[i3] > spreadX / 2) velocities[i3] *= -1;
    if (pos[i3 + 1] < -spreadY / 2 || pos[i3 + 1] > spreadY / 2) velocities[i3 + 1] *= -1;
    if (pos[i3 + 2] < -spreadZ / 2 || pos[i3 + 2] > spreadZ / 2) velocities[i3 + 2] *= -1;

    // Subtle hover proximity repulsion
    const dx = pos[i3] - mouseX;
    const dy = pos[i3 + 1] - mouseY;
    const distHover = Math.sqrt(dx * dx + dy * dy);
    if (distHover < 11) {
      const force = (11 - distHover) / 11 * 0.12;
      pos[i3] += (dx / distHover) * force;
      pos[i3 + 1] += (dy / distHover) * force;
    }

    // Reaction to active pulse waves
    for (let p = 0; p < pulses.length; p++) {
      const pulse = pulses[p];
      const pdx = pos[i3] - pulse.x;
      const pdy = pos[i3 + 1] - pulse.y;
      const pdz = pos[i3 + 2] - pulse.z;
      const pDist = Math.sqrt(pdx * pdx + pdy * pdy + pdz * pdz);

      // Distance from expanding ring front
      const ringDelta = Math.abs(pDist - pulse.radius);
      if (ringDelta < 4.5 && pDist > 0.01) {
        const factor = (1.0 - ringDelta / 4.5) * pulse.strength * 0.45;
        // Shockwave burst pushing particles radially outward
        velocities[i3] += (pdx / pDist) * factor;
        velocities[i3 + 1] += (pdy / pDist) * factor;
        velocities[i3 + 2] += (pdz / pDist) * factor * 0.5;
      }
    }
  }

  particleSystem.geometry.attributes.position.needsUpdate = true;

  // Dynamic connecting constellation lines
  let vertexIndex = 0;
  let colorIndex = 0;
  let connectionCount = 0;

  for (let i = 0; i < particleCount; i++) {
    const i3 = i * 3;
    for (let j = i + 1; j < particleCount; j++) {
      const j3 = j * 3;
      const dx = pos[i3] - pos[j3];
      const dy = pos[i3 + 1] - pos[j3 + 1];
      const dz = pos[i3 + 2] - pos[j3 + 2];
      const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

      if (dist < maxDistance && connectionCount < maxConnections) {
        const alpha = (1.0 - dist / maxDistance) * 0.45;

        linePositions[vertexIndex++] = pos[i3];
        linePositions[vertexIndex++] = pos[i3 + 1];
        linePositions[vertexIndex++] = pos[i3 + 2];

        linePositions[vertexIndex++] = pos[j3];
        linePositions[vertexIndex++] = pos[j3 + 1];
        linePositions[vertexIndex++] = pos[j3 + 2];

        lineColors[colorIndex++] = 0.145 * alpha;
        lineColors[colorIndex++] = 0.388 * alpha;
        lineColors[colorIndex++] = 0.921 * alpha;

        lineColors[colorIndex++] = 0.376 * alpha;
        lineColors[colorIndex++] = 0.647 * alpha;
        lineColors[colorIndex++] = 0.98 * alpha;

        connectionCount++;
      }
    }
  }

  lineGeometry.setDrawRange(0, connectionCount * 2);
  lineGeometry.attributes.position.needsUpdate = true;
  lineGeometry.attributes.color.needsUpdate = true;

  // Slow ambient rotation
  particleSystem.rotation.y += 0.0006;
  linesMesh.rotation.y += 0.0006;

  renderer.render(scene, camera);
}

animate();

// Cleanup handler
container._threeCleanup = function() {
  cancelAnimationFrame(frameId);
  window.removeEventListener('mousemove', onMouseMove);
  window.removeEventListener('pointerdown', onMouseDown);
  window.removeEventListener('resize', onResize);
  renderer.dispose();
  geometry.dispose();
  pMaterial.dispose();
  lineGeometry.dispose();
  lineMaterial.dispose();
  particleTexture.dispose();
};
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_7 -->
</body>
</html>
